<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Tareas</title>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tareas">
<meta name="theme-color" id="metaTheme" content="#f8f7f5">
<style>
  :root {
    --bg: #f8f7f5; --surface: #ffffff; --border: #e8e5e0;
    --text: #2a2a2a; --text-mid: #555; --text-light: #888; --done: #b5b1aa;
    --chip: #f1efeb; --overlay: rgba(0,0,0,0.35);
    --alta: #e05a5a; --media: #e8b92e; --baja: #4caf6e;
    --accent: #e05a5a;
    --accent-soft: color-mix(in srgb, var(--accent) 14%, transparent);
    --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1a19; --surface: #242321; --border: #34322f;
      --text: #ecebe8; --text-mid: #b9b6b1; --text-light: #8f8c87; --done: #5d5a55;
      --chip: #2f2d2a; --overlay: rgba(0,0,0,0.6);
      --alta: #ec6f6f; --media: #f0c64a; --baja: #5cc07e;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1a19; --surface: #242321; --border: #34322f;
    --text: #ecebe8; --text-mid: #b9b6b1; --text-light: #8f8c87; --done: #5d5a55;
    --chip: #2f2d2a; --overlay: rgba(0,0,0,0.6);
    --alta: #ec6f6f; --media: #f0c64a; --baja: #5cc07e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }
  button { font-family: var(--font); color: inherit; }

  /* ─── Encabezado ─── */
  .top { max-width: 680px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 20px 4px; display: flex; align-items: center; justify-content: space-between; }
  .brand { font-size: 20px; font-weight: 700; letter-spacing: -.5px; }
  .brand .acc { color: var(--accent); }
  .brand .who { color: var(--text-mid); font-weight: 500; }
  .gear { background: none; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; color: var(--text-light); cursor: pointer; }
  .gear:hover { color: var(--accent); }
  .seg { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 3px; }
  .seg button { background: none; border: none; font-weight: 500; font-size: 13px; padding: 7px 18px; border-radius: 8px; color: var(--text-light); cursor: pointer; }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
  .filterbar { max-width: 680px; margin: 0 auto; padding: 8px 20px 0; }

  main { max-width: 680px; margin: 0 auto; padding: 4px 0 120px; }

  /* ─── Grupos ─── */
  .group { margin-top: 14px; }
  .ghead { display: flex; align-items: center; gap: 8px; padding: 10px 20px; cursor: pointer; user-select: none; }
  .ghead .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .ghead .name { font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--text-mid); }
  .ghead .count { font-size: 12px; color: var(--text-light); }
  .ghead.static { cursor: default; }
  .gtag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-light); flex: none; max-width: 90px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .gtag i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .none { padding: 12px 0 4px 36px; font-size: 13px; color: var(--text-light); }
  .ghead .chev { margin-left: auto; color: var(--text-light); font-size: 12px; }

  /* ─── Fila de tarea ─── */
  .row { padding: 0 20px; position: relative; }
  .line { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 4px 0; border-bottom: 1px solid var(--border); cursor: pointer;
          user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: pan-y; }
  .check { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 1.8px solid var(--text-light); background: none; cursor: pointer; position: relative; }
  .check:hover { border-color: var(--accent); }
  .title { flex: 1; min-width: 0; font-size: 16px; line-height: 1.3; word-break: break-word; }
  .meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-light); flex: none; }
  .meta .u { width: 9px; height: 9px; border-radius: 50%; }
  .meta .late { color: var(--alta); font-weight: 600; }
  .meta .hoytag { font-size: 10px; font-weight: 700; letter-spacing: .08em; color: var(--accent); }
  .done .check { background: var(--done); border-color: var(--done); }
  .done .check::after { content: "✓"; position: absolute; inset: 0; color: var(--bg); font-size: 14px; display: grid; place-items: center; }
  .done .title { color: var(--done); text-decoration: line-through; }
  .row.dragging .line { opacity: .45; }
  .row.drop-before::before, .group.drop-end .rows::after { content: ""; display: block; height: 2px; background: var(--accent); margin: 0 20px; border-radius: 1px; position: absolute; left: 0; right: 0; top: -1px; }
  .group.drop-end .rows::after { position: static; margin: 0 20px; }

  /* ─── Detalle desplegado ─── */
  .open { background: var(--surface); margin: 4px 0; border-radius: 12px; border: 1px solid var(--border); padding: 0 14px; }
  .open .line { border-bottom: 0; cursor: default; }
  .title-in { flex: 1; min-width: 0; font-family: var(--font); font-size: 16px; color: var(--text); background: none; border: none; outline: none; border-bottom: 1.5px solid transparent; padding: 4px 0; }
  .title-in:focus { border-bottom-color: var(--accent); }
  .fold { background: none; border: none; color: var(--text-light); font-size: 13px; font-family: var(--font); padding: 6px 4px 6px 12px; cursor: pointer; }
  .detail { padding: 2px 0 14px 36px; display: flex; flex-direction: column; gap: 12px; }
  .drow { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-light); min-height: 30px; }
  .drow .k { width: 62px; flex: none; }
  .pill { position: relative; display: inline-block; background: var(--chip); color: var(--text-mid); padding: 6px 12px; border-radius: 999px; font-size: 13px; border: 1px solid transparent; cursor: pointer; font-family: var(--font); }
  .pill.add { background: none; border: 1px dashed var(--border); color: var(--text-light); }
  .pill.set { background: var(--accent-soft); color: var(--accent); }
  .pill.sel { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  /* Campo de fecha visible con botón OK: no se guarda mientras el selector está abierto (iOS dispara `change` al abrirlo y en cada giro de la rueda, y redibujar lo cerraba) */
  .whenedit { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; flex-wrap: wrap; }
  .dtin { font-family: var(--font); font-size: 16px; color: var(--text); background: var(--chip); border: 1.5px solid transparent; border-radius: 10px; padding: 6px 8px; min-width: 0; max-width: 100%; }
  .dtin.bad { border-color: var(--alta); }
  .okbtn { font-family: var(--font); font-size: 14px; font-weight: 600; background: var(--accent); color: #fff; border: none; border-radius: 999px; padding: 7px 16px; cursor: pointer; }
  .toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translate(-50%, 12px); max-width: calc(100% - 32px); background: var(--text); color: var(--bg); font-size: 14px; padding: 10px 16px; border-radius: 12px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50; text-align: center; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .avrow { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .avrow .t { flex: 1; min-width: 0; font-size: 15px; word-break: break-word; }
  .avrow .w { font-size: 12px; color: var(--text-light); flex: none; }
  .avrow .w.late { color: var(--alta); font-weight: 600; }
  .dupbox { margin: 12px 0 0; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); }
  .dupmsg { font-size: 14px; margin-bottom: 10px; word-break: break-word; }
  .opt { font-size: 12px; color: var(--text-light); }
  .xbtn { position: relative; z-index: 2; background: none; border: none; color: var(--text-light); font-size: 15px; cursor: pointer; padding: 8px 12px; margin: -4px 0; }
  .urg { display: flex; gap: 10px; }
  .urg button { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; opacity: .35; cursor: pointer; }
  .urg button.sel { opacity: 1; border-color: var(--text); }
  .gsel { font-family: var(--font); font-size: 13px; background: var(--chip); color: var(--text-mid); border: none; border-radius: 999px; padding: 6px 10px; outline: none; }
  .dfoot { display: flex; align-items: center; justify-content: space-between; padding-top: 2px; }
  .pill.hoy { background: none; border: 1px solid var(--border); color: var(--text-light); font-size: 12px; font-weight: 700; letter-spacing: .08em; }
  .pill.hoy.on { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
  .del { background: none; border: none; color: var(--alta); font-size: 13px; cursor: pointer; padding: 6px 4px; }

  .empty { text-align: center; color: var(--text-light); padding: 56px 28px; font-size: 14px; line-height: 1.6; }
  .empty b { display: block; font-size: 16px; color: var(--text-mid); margin-bottom: 4px; }

  /* ─── Botón + y hoja de captura ─── */
  .fab { position: fixed; right: 20px; bottom: calc(24px + env(safe-area-inset-bottom)); width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #fff; border: none;
         font-size: 30px; font-weight: 300; cursor: pointer; z-index: 50; box-shadow: 0 6px 16px rgba(0,0,0,.28); display: grid; place-items: center; }
  .fab:active { transform: scale(.95); }
  .overlay { position: fixed; inset: 0; background: var(--overlay); z-index: 100; display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .overlay.open { opacity: 1; pointer-events: all; }
  .sheet { background: var(--surface); width: 100%; max-width: 680px; border-radius: 22px 22px 0 0; padding: 12px 20px calc(18px + env(safe-area-inset-bottom)); max-height: 92vh; overflow-y: auto;
           transform: translateY(40px); transition: transform .25s cubic-bezier(.4,0,.2,1); }
  .overlay.open .sheet { transform: translateY(0); }
  .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--border); margin: 0 auto 14px; }
  .shead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .shead h2 { font-size: 18px; }
  .linkbtn { background: none; border: none; color: var(--accent); font-size: 14px; font-weight: 600; cursor: pointer; padding: 6px 2px; }
  .addrow { display: flex; align-items: center; gap: 8px; border-bottom: 1.5px solid var(--accent); }
  .addrow input { flex: 1; font-family: var(--font); font-size: 18px; color: var(--text); background: none; border: none; outline: none; padding: 8px 0 10px; }
  .send { flex: none; width: 34px; height: 34px; border-radius: 50%; border: none; background: var(--accent); color: #fff; font-size: 18px; cursor: pointer; }
  .chips { display: flex; gap: 8px; padding: 14px 0 4px; overflow-x: auto; }
  .chips .pill { flex: none; }
  .newg { display: flex; gap: 8px; padding-top: 10px; }
  .newg input[type=text], .field input[type=text] { flex: 1; font-family: var(--font); font-size: 16px; color: var(--text); background: var(--chip); border: none; border-radius: 10px; padding: 10px 12px; outline: none; min-width: 0; }
  .newg input[type=color], .field input[type=color] { width: 44px; height: 40px; border: none; background: none; padding: 0; cursor: pointer; }
  .adddetail { padding: 10px 0 0; gap: 8px; }
  .flash { font-size: 12px; color: var(--baja); height: 16px; padding-top: 6px; }

  /* ─── Ajustes ─── */
  .sec { margin-bottom: 22px; }
  .sec h3 { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-light); margin-bottom: 10px; }
  .field { display: flex; gap: 8px; align-items: center; }
  .grow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .grow .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .grow .n { flex: 1; }
  .grow .c { font-size: 12px; color: var(--text-light); }
  .grow .del:disabled { opacity: .3; cursor: not-allowed; }
  .swatches { display: flex; gap: 12px; }
  .swatch { width: 30px; height: 30px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; }
  .swatch.on { border-color: var(--text); }
  .btnrow { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn2 { font-family: var(--font); font-size: 14px; background: var(--chip); border: none; border-radius: 10px; padding: 10px 16px; cursor: pointer; color: var(--text); }
  .hint { font-size: 12px; color: var(--text-light); margin-top: 8px; line-height: 1.5; }
  .primary { font-family: var(--font); font-size: 15px; font-weight: 600; background: var(--accent); color: #fff; border: none; border-radius: 12px; padding: 13px 22px; cursor: pointer; width: 100%; }

  /* ─── Alarmas que no sonaron ─── */
  .missed { margin: 10px 20px 0; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); }
  .missed .mh { display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  .missed .mi { display: flex; gap: 10px; padding: 7px 0; font-size: 15px; cursor: pointer; }
  .missed .mi span:first-child { flex: 1; min-width: 0; word-break: break-word; }
  .missed .mi span:last-child { font-size: 12px; color: var(--text-mid); flex: none; padding-top: 2px; }

  /* ─── Inicialización (primer uso) ─── */
  .onb { position: fixed; inset: 0; z-index: 300; background: var(--bg); display: none; overflow-y: auto; }
  .onb.open { display: block; }
  .onb-in { max-width: 420px; margin: 0 auto; padding: calc(56px + env(safe-area-inset-top)) 24px calc(32px + env(safe-area-inset-bottom)); min-height: 100%; display: flex; flex-direction: column; }
  .onb h1 { font-size: 26px; letter-spacing: -.5px; margin-bottom: 8px; }
  .onb p.lead { color: var(--text-mid); font-size: 15px; line-height: 1.5; margin-bottom: 26px; }
  .onb .field input[type=text] { font-size: 18px; padding: 14px 14px; }
  .onb .spacer { flex: 1; min-height: 24px; }
  .onb .dots { display: flex; gap: 6px; margin-bottom: 28px; }
  .onb .dots i { width: 22px; height: 4px; border-radius: 2px; background: var(--border); }
  .onb .dots i.on { background: var(--accent); }
  .onb .ghost { background: none; border: none; color: var(--text-mid); font-size: 14px; padding: 14px; cursor: pointer; width: 100%; margin-top: 6px; }
  .onb .chips { flex-wrap: wrap; overflow: visible; padding: 0 0 14px; }
  .onb .sub { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-light); margin: 22px 0 10px; }
</style>
</head>
<body>

<div class="top">
  <div class="brand">Tareas<span id="who" class="who"></span></div>
  <button class="gear" onclick="openSettings()" aria-label="Ajustes">⚙</button>
</div>
<div class="filterbar">
  <div class="seg" id="seg">
    <button id="segTodas" onclick="setScope('todas')">Todas</button>
    <button id="segHoy" onclick="setScope('hoy')">HOY</button>
    <button id="segProx" onclick="setScope('prox')">Próximos</button>
  </div>
</div>

<main id="list"></main>

<button class="fab" onclick="openAdd()" aria-label="Agregar tarea">+</button>

<!-- AGREGAR -->
<div class="overlay" id="addOverlay" onclick="if(event.target===this)closeAdd()">
  <div class="sheet" id="addSheet">
    <div class="grab"></div>
    <div class="addrow">
      <input type="text" id="addInput" placeholder="Nueva tarea…" enterkeyhint="done" autocomplete="off"
             oninput="dupConfirmado=false;ocultarDup()" onkeydown="if(event.key==='Enter'){event.preventDefault();submitAdd();}">
      <button class="send" onclick="submitAdd()" aria-label="Agregar">✓</button>
    </div>
    <div class="chips" id="addChips"></div>
    <div class="newg" id="newGroupRow" style="display:none">
      <input type="text" id="newGroupName" placeholder="Nombre del grupo" onkeydown="if(event.key==='Enter'){event.preventDefault();createGroupFromSheet();}">
      <button class="send" onclick="createGroupFromSheet()" aria-label="Crear grupo">✓</button>
    </div>
    <div class="detail adddetail" id="addDetails"></div>
    <div class="dupbox" id="addDup" style="display:none"></div>
    <div class="flash" id="addFlash"></div>
    <div style="text-align:right"><button class="linkbtn" onclick="closeAdd()">Cerrar</button></div>
  </div>
</div>

<!-- AJUSTES -->
<div class="overlay" id="setOverlay" onclick="if(event.target===this)closeSettings()">
  <div class="sheet">
    <div class="grab"></div>
    <div class="shead"><h2>Ajustes</h2><button class="linkbtn" onclick="closeSettings()">Cerrar</button></div>

    <div class="sec">
      <h3>Nombre</h3>
      <div class="field"><input type="text" id="setName" placeholder="Tu nombre" onchange="saveName(this.value)"></div>
    </div>

    <div class="sec">
      <h3>Apariencia</h3>
      <div class="seg" id="setTema" style="margin-bottom:14px"></div>
      <div class="swatches" id="setAcento"></div>
    </div>

    <div class="sec">
      <h3>Grupos</h3>
      <div id="setGroups"></div>
      <div class="newg">
        <input type="text" id="setNewName" placeholder="Nuevo grupo" onkeydown="if(event.key==='Enter'){event.preventDefault();addGroupFromSettings();}">
        <input type="color" id="setNewColor" value="#5b9fd4" title="Color">
        <button class="send" onclick="addGroupFromSettings()" aria-label="Crear grupo">+</button>
      </div>
      <p class="hint">Solo se pueden eliminar grupos sin tareas.</p>
    </div>

    <div class="sec">
      <h3>Alarmas con la app cerrada</h3>
      <p class="hint" id="pushInfo" style="margin:0 0 10px"></p>
      <div class="btnrow"><button class="btn2" id="pushBtn" onclick="onPushBtn()" style="display:none">Activar en este dispositivo</button></div>
    </div>

    <div class="sec">
      <h3>Widget del Mac</h3>
      <p class="hint" id="widgetInfo" style="margin:0 0 10px"></p>
      <div class="btnrow"><button class="btn2" id="widgetBtn" onclick="toggleWidget()"></button><button class="btn2" id="widgetCopy" onclick="copyWidgetToken()" style="display:none">Copiar datos del widget</button></div>
    </div>

    <div class="sec">
      <h3>Datos</h3>
      <div class="btnrow">
        <button class="btn2" onclick="exportJSON()">↓ Exportar</button>
        <button class="btn2" onclick="document.getElementById('importFile').click()">↑ Importar</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="importJSON(this)">
      <p class="hint">Los datos se guardan solo en este dispositivo. Exportar crea una copia de respaldo.</p>
    </div>
  </div>
</div>

<!-- ALARMA (se abre al tocar la notificación) -->
<div class="toast" id="toast" role="status"></div>

<div class="overlay" id="alOverlay" onclick="if(event.target===this)closeAlarmSheet()">
  <div class="sheet">
    <div class="grab"></div>
    <div class="shead"><h2 id="alTitle" style="word-break:break-word"></h2><button class="linkbtn" onclick="closeAlarmSheet()">Cerrar</button></div>
    <p class="hint" id="alWhen" style="margin:0 0 16px"></p>
    <div class="btnrow">
      <button class="btn2" onclick="snoozeMinutes(10)">Posponer 10 min</button>
      <button class="btn2" onclick="snoozeTomorrow()">Mañana 9:00</button>
      <button class="btn2" onclick="showSnoozePick()">Elegir hora</button>
    </div>
    <div class="whenedit" id="alPick" style="display:none;margin-top:14px">
      <input type="datetime-local" class="dtin" id="alInput">
      <button class="okbtn" onclick="snoozeFromPick()">Posponer</button>
    </div>
    <div style="margin-top:16px"><button class="primary" onclick="doneFromSheet()">Hecho</button></div>
  </div>
</div>

<!-- PLAZOS POR PLANIFICAR -->
<div class="overlay" id="avOverlay" onclick="if(event.target===this)closeAviso()">
  <div class="sheet">
    <div class="grab"></div>
    <div class="shead"><h2>Plazos por planificar</h2><button class="linkbtn" onclick="closeAviso()">Listo</button></div>
    <p class="hint" id="avHint" style="margin:0 0 6px"></p>
    <div id="avList"></div>
  </div>
</div>

<!-- INICIALIZACIÓN -->
<div class="onb" id="onb"><div class="onb-in" id="onbBody"></div></div>

<script>
// ─── CONSTANTES ──────────────────────────────────────────────────
const LEGACY_AMBITOS = [
  { id:'casa',          nombre:'Casa',          color:'#a8d5b5' },
  { id:'personal',      nombre:'Personal',      color:'#9dc8f0' },
  { id:'julieta',       nombre:'Julieta',       color:'#f4b8ce' },
  { id:'investigacion', nombre:'Investigación', color:'#ffe08a' },
  { id:'proyectos',     nombre:'Proyectos',     color:'#ffbf9b' },
];
const GROUP_COLORS = ['#e07a5a','#5b9fd4','#9b7fd4','#4caf6e','#e8b92e','#d46fa0','#4fb3b3'];
const ACENTOS = ['#e05a5a','#4a8fd4','#3fa66a','#8a6fd1','#d99a1e'];
const RANK = { alta:0, media:1, baja:2 };
const K = {
  tasks:'tareas_v2', ambitos:'tareas_ambitos_v1', name:'tareas_username',
  tema:'tareas_tema', onb:'tareas_onboarded', codigo:'tareas_codigo', push:'tareas_push', widget:'tareas_widget', snapPend:'tareas_widget_pend', acento:'tareas_acento', plegados:'tareas_plegados', ultimo:'tareas_ultimo_grupo', aviso:'tareas_aviso', dupNo:'tareas_dup_no',
};

// ─── ESTADO ──────────────────────────────────────────────────────
let tasks = [];
let ambitos = [];
let userName = '';
let prefs = { tema:'sistema', acento:ACENTOS[0] };
let plegados = new Set();
let scope = 'hoy';
let openId = null;
let confirmDelId = null;
let editWhen = null; // { id, kind } mientras se edita Alarma o Plazo
let addGroup = null;
let addDraft = null; // detalles opcionales de la tarea que se está escribiendo
let addEdit = null;  // { kind, custom } mientras se elige Alarma o Plazo en la hoja

// ─── STORAGE ─────────────────────────────────────────────────────
function lsGet(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }
function lsJSON(k, fallback) { try { const v = JSON.parse(lsGet(k)); return v == null ? fallback : v; } catch(e) { return fallback; } }

function load() {
  const rawTasks = lsJSON(K.tasks, null);
  const rawAmb = lsJSON(K.ambitos, null);
  tasks = Array.isArray(rawTasks) ? rawTasks : [];
  ambitos = Array.isArray(rawAmb) ? rawAmb : (tasks.length ? JSON.parse(JSON.stringify(LEGACY_AMBITOS)) : []);
  userName = lsGet(K.name) || '';
  const tema = lsGet(K.tema); if (['sistema','claro','oscuro'].includes(tema)) prefs.tema = tema;
  const ac = lsGet(K.acento); if (/^#[0-9a-f]{6}$/i.test(ac||'')) prefs.acento = ac;
  plegados = new Set(lsJSON(K.plegados, []));
  normalize();
}
function save() {
  lsSet(K.tasks, JSON.stringify(tasks));
  lsSet(K.ambitos, JSON.stringify(ambitos));
  queueSnapshot();
}
function savePlegados() { lsSet(K.plegados, JSON.stringify([...plegados])); }

// Deja los datos en el formato actual (también sirve para lo importado)
function normalize() {
  ambitos = ambitos.filter(a => a && a.id).map((a,i) => ({
    id:a.id, nombre:a.nombre||a.id, color:a.color || a.stripe || GROUP_COLORS[i % GROUP_COLORS.length]
  }));
  tasks = tasks.filter(t => t && t.id && t.titulo).map(t => ({
    id:t.id, titulo:String(t.titulo), ambito:t.ambito,
    prioridad: t.prioridad in RANK ? t.prioridad : null,
    deadline: t.deadline || null,
    enHoy: !!t.enHoy,
    completada: !!t.completada, completadaEn: t.completadaEn || null,
    alarma: t.alarma && t.alarma.activa && t.alarma.fechaHora ? { activa:true, fechaHora:t.alarma.fechaHora, disparada:!!t.alarma.disparada, perdida:!!t.alarma.perdida, srv:!!t.alarma.srv } : { activa:false, fechaHora:null, disparada:false },
    // Día programado ('YYYY-MM-DD'). diaAplicada: ya se aplicó la entrada automática a HOY de ese día.
    dia: /^\d{4}-\d{2}-\d{2}$/.test(t.dia || '') ? t.dia : null,
    diaAplicada: t.diaAplicada === undefined ? true : !!t.diaAplicada,
    manual: !!t.manual,
    fechaCreacion: t.fechaCreacion || new Date().toISOString(),
    orden: typeof t.orden === 'number' ? t.orden : 0,
  }));
  // Una alarma siempre cae en el día programado (así se migran también las alarmas antiguas)
  tasks.forEach(t => { if (t.alarma.activa) t.dia = diaKey(t.alarma.fechaHora); });
  // Tareas con un grupo que ya no existe: se crea para no perderlas
  tasks.forEach(t => {
    if (!t.ambito) t.ambito = 'sin-grupo';
    if (!ambitos.find(a => a.id === t.ambito)) {
      ambitos.push({ id:t.ambito, nombre:t.ambito === 'sin-grupo' ? 'Sin grupo' : t.ambito, color:nextColor() });
    }
  });
  purgeCompleted();
}

// ─── UTILIDADES ──────────────────────────────────────────────────
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s) { return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function nextColor() { return GROUP_COLORS[ambitos.length % GROUP_COLORS.length]; }
function getAmbito(id) { return ambitos.find(a => a.id === id); }
function dayKey(d) { d = new Date(d); return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); }
function isoToLocal(iso) {
  const d = new Date(iso); const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function hm(d) { return d.toLocaleTimeString('es-CL', { hour:'2-digit', minute:'2-digit', hour12:false }); }
function fmtShort(iso) {
  const d = new Date(iso), now = new Date();
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(d) - day(now)) / 864e5);
  if (diff === 0) return hm(d);
  if (diff === -1) return 'ayer';
  if (diff === 1) return 'mañana';
  if (diff > 1 && diff < 7) return d.toLocaleDateString('es-CL', { weekday:'short' }).replace('.','');
  return d.toLocaleDateString('es-CL', { day:'numeric', month:'short' }).replace('.','');
}
function fmtLong(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('es-CL', { weekday:'short', day:'numeric', month:'short' }).replace(/\./g,'') + ' · ' + hm(d);
}

// ─── DÍAS (para programar) ───────────────────────────────────────
const pad2 = n => String(n).padStart(2, '0');
function diaKey(d) { d = new Date(d); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
const hoyDia = () => diaKey(new Date());
const diaToDate = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
function addDias(k, n) { const d = diaToDate(k); d.setDate(d.getDate() + n); return diaKey(d); }
const diasHasta = k => Math.round((diaToDate(k) - diaToDate(hoyDia())) / 864e5);
function fmtDia(k) {
  const n = diasHasta(k);
  if (n === 0) return 'hoy';
  if (n === 1) return 'mañana';
  if (n === -1) return 'ayer';
  const d = diaToDate(k);
  if (n > 1 && n < 7) return d.toLocaleDateString('es-CL', { weekday:'short' }).replace('.', '');
  return d.toLocaleDateString('es-CL', { day:'numeric', month:'short' }).replace('.', '');
}
function fmtDiaLargo(k) { return diaToDate(k).toLocaleDateString('es-CL', { weekday:'short', day:'numeric', month:'short' }).replace(/\./g, ''); }
// Días hábiles: lunes a viernes (los fines de semana no se programan, solo se ponen al día)
const esHabil = k => { const w = diaToDate(k).getDay(); return w >= 1 && w <= 5; };
function proxHabil(k) { let d = addDias(k, 1); while (!esHabil(d)) d = addDias(d, 1); return d; }

// Los completados desaparecen al terminar el día (se borran de verdad)
function purgeCompleted() {
  const today = dayKey(new Date());
  const before = tasks.length;
  tasks = tasks.filter(t => !t.completada || (t.completadaEn && dayKey(t.completadaEn) === today));
  return tasks.length !== before;
}

// ─── PROGRAMAR ───────────────────────────────────────────────────
// Una tarea se programa para un día, con hora opcional (la hora es la que dispara la
// notificación). Regla de HOY, con prioridad: si el día es futuro la tarea sale de HOY
// y entra sola ese día; si es hoy (o antes), entra a HOY de inmediato.
function setProgramada(t, dia, when) {
  t.dia = dia;
  const futuro = dia > hoyDia();
  t.enHoy = !futuro;
  t.diaAplicada = !futuro;
  if (when) {
    t.alarma = { activa:true, fechaHora:when.toISOString(), disparada:false, perdida:false };
    delete ultimoIntento[t.id];
  } else if (t.alarma.activa) {
    t.alarma = { activa:false, fechaHora:null, disparada:false };
    cancelAlarm(t.id);
  }
}
function clearProgramada(t) {
  t.dia = null; t.diaAplicada = true;
  if (t.alarma.activa) { t.alarma = { activa:false, fechaHora:null, disparada:false }; cancelAlarm(t.id); }
}
// Posponer mueve la alarma: el día programado la sigue (sin forzar HOY si es hoy)
function seguirAlarma(t) {
  t.dia = diaKey(t.alarma.fechaHora);
  if (t.dia > hoyDia()) { t.enHoy = false; t.diaAplicada = false; }
}
// Llegó el día programado: la tarea entra sola en HOY (una sola vez; quitarla de HOY después es manual)
function aplicarProgramadas() {
  const hoy = hoyDia(); let cambio = false;
  tasks.forEach(t => {
    if (!t.completada && t.dia && t.dia <= hoy && !t.diaAplicada) { t.enHoy = true; t.diaAplicada = true; cambio = true; }
  });
  return cambio;
}

// ─── DUPLICADOS ──────────────────────────────────────────────────
// Al crear una tarea se estima la probabilidad de que repita otra pendiente: un puntaje
// logístico sobre unas pocas señales del título, el grupo y la fecha. Solo avisa.
const STOP = new Set(['a','al','algo','con','de','del','el','en','la','las','lo','los','mi','mis','para','por','que','se','su','sus','un','una','y','o','e','u']);
const normTxt = x => String(x).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9ñ ]/g, ' ');
function palabras(x) { return new Set(normTxt(x).split(/\s+/).filter(w => w.length > 1 && !STOP.has(w))); }
function trigramas(x) {
  const t = ' ' + normTxt(x).replace(/\s+/g, ' ').trim() + ' ', out = new Map();
  for (let i = 0; i + 3 <= t.length; i++) { const g = t.slice(i, i + 3); out.set(g, (out.get(g) || 0) + 1); }
  return out;
}
function dice(a, b) {
  let inter = 0, na = 0, nb = 0;
  a.forEach(v => na += v); b.forEach(v => nb += v);
  a.forEach((v, g) => { if (b.has(g)) inter += Math.min(v, b.get(g)); });
  return na + nb ? 2 * inter / (na + nb) : 0;
}
// Señales de un par (todas entre 0 y 1): palabras en común, contención, letras en común, mismo grupo, fecha cercana
function senalesDup(a, b) {
  const A = palabras(a.titulo), B = palabras(b.titulo);
  let inter = 0; A.forEach(w => { if (B.has(w)) inter++; });
  const union = A.size + B.size - inter;
  const dist = a.dia && b.dia ? Math.abs((diaToDate(a.dia) - diaToDate(b.dia)) / 864e5) : null;
  return [
    union ? inter / union : 0,
    A.size && B.size ? inter / Math.min(A.size, B.size) : 0,
    dice(trigramas(a.titulo), trigramas(b.titulo)),
    a.ambito === b.ambito ? 1 : 0,
    dist === null ? 0 : (dist === 0 ? 1 : dist <= 2 ? 0.5 : 0),
  ];
}
const DUP_W0 = [4, 2, 3, 1, 0.5], DUP_B0 = -6, DUP_UMBRAL = 0.7;
const sigmoide = z => 1 / (1 + Math.exp(-z));
function probDup(x) { return sigmoide(DUP_B0 + x.reduce((s, v, i) => s + DUP_W0[i] * v, 0)); }
const parKey = (a, b) => [normTxt(a).trim(), normTxt(b).trim()].sort().join('|');
const dupDescartados = () => new Set(lsJSON(K.dupNo, []));
// Tareas pendientes que probablemente repiten a `nueva` (las ya descartadas como no duplicadas no vuelven a salir)
function posiblesDuplicadas(nueva) {
  const no = dupDescartados();
  return tasks.filter(t => !t.completada && t.id !== nueva.id && !no.has(parKey(t.titulo, nueva.titulo)))
    .map(t => ({ t, p: probDup(senalesDup(nueva, t)) }))
    .filter(x => x.p >= DUP_UMBRAL).sort((a, b) => b.p - a.p).slice(0, 3);
}

// ─── ORDEN ───────────────────────────────────────────────────────
const rankOf = t => t.prioridad in RANK ? RANK[t.prioridad] : 3;
const byOrden = (a,b) => (a.orden||0) - (b.orden||0);

// Urgentes arriba, salvo lo que el usuario fijó a mano (t.manual)
function placeByRule(t) {
  const list = tasks.filter(x => x.ambito === t.ambito && !x.completada && x.id !== t.id).sort(byOrden);
  const r = rankOf(t);
  let idx = list.findIndex(x => !x.manual && rankOf(x) > r);
  if (idx === -1) idx = list.length;
  list.splice(idx, 0, t);
  list.forEach((x,i) => x.orden = i * 10);
}

function groupRows(gid) {
  // La tarea abierta se mantiene a la vista aunque deje de estar en HOY (por ejemplo, al ponerle un Plazo)
  const inScope = t => t.ambito === gid && (scope === 'todas' || t.enHoy || t.id === openId);
  const pend = tasks.filter(t => inScope(t) && !t.completada).sort(byOrden);
  const done = tasks.filter(t => inScope(t) && t.completada).sort((a,b) => new Date(a.completadaEn) - new Date(b.completadaEn));
  return { pend, done };
}

// ─── RENDER ──────────────────────────────────────────────────────
function render() {
  document.getElementById('who').innerHTML = userName ? ` · <span class="acc">${esc(userName)}</span>` : '';
  document.getElementById('segTodas').classList.toggle('on', scope === 'todas');
  document.getElementById('segHoy').classList.toggle('on', scope === 'hoy');
  document.getElementById('segProx').classList.toggle('on', scope === 'prox');
  if (scope === 'prox') { document.getElementById('list').innerHTML = missedHTML() + proxHTML(); return; }

  let html = '', shown = 0;
  ambitos.forEach(a => {
    const { pend, done } = groupRows(a.id);
    if (scope === 'hoy' && !pend.length && !done.length) return;
    shown++;
    const fold = plegados.has(a.id);
    html += `<section class="group" data-gid="${a.id}">
      <div class="ghead" onclick="toggleGroup('${a.id}')">
        <i class="dot" style="background:${esc(a.color)}"></i>
        <span class="name">${esc(a.nombre)}</span><span class="count">${pend.length || ''}</span>
        <span class="chev">${fold ? '▸' : '▾'}</span>
      </div>`;
    if (!fold) html += `<div class="rows">${pend.map(t => rowHTML(t)).join('')}${done.map(t => rowHTML(t)).join('')}</div>`;
    html += `</section>`;
  });

  if (!ambitos.length) {
    html = `<div class="empty"><b>Aún no hay tareas</b>Toca + para agregar la primera.<br>Podrás crear grupos al agregarla.</div>`;
  } else if (scope === 'hoy' && !shown) {
    html = `<div class="empty"><b>Nada marcado para HOY</b>Las tareas nuevas quedan en HOY por defecto.</div>`;
  } else if (scope === 'todas' && !tasks.length) {
    html += `<div class="empty"><b>Sin tareas</b>Toca + para agregar la primera.</div>`;
  }
  document.getElementById('list').innerHTML = missedHTML() + html;
}

// ─── PLAZOS POR PLANIFICAR ───────────────────────────────────────
// Tareas con Plazo hasta el siguiente día hábil (o vencido) que no están programadas ni en HOY.
// Se ofrecen una vez, en la primera apertura de cada día, para elegir cuáles activar hoy.
function plazosSinPlan() {
  const fin = proxHabil(hoyDia());
  return tasks.filter(t => !t.completada && t.deadline && !t.enHoy && !t.dia && diaKey(t.deadline) <= fin)
    .sort((a, b) => new Date(a.deadline) - new Date(b.deadline));
}
let avIds = [];
function openAviso() {
  avIds = plazosSinPlan().map(t => t.id);
  if (!avIds.length) return;
  renderAviso();
  document.getElementById('avOverlay').classList.add('open');
}
function closeAviso() { document.getElementById('avOverlay').classList.remove('open'); render(); }
function renderAviso() {
  const fin = proxHabil(hoyDia());
  document.getElementById('avHint').textContent = `Vencen hasta ${diasHasta(fin) === 1 ? 'mañana' : 'el ' + fmtDiaLargo(fin)} (o ya vencieron) y no están en HOY. Marca las que harás hoy.`;
  document.getElementById('avList').innerHTML = avIds.map(id => {
    const t = T(id); if (!t) return '';
    const late = new Date(t.deadline) < new Date();
    return `<div class="avrow"><span class="t">${esc(t.titulo)}</span><span class="w${late?' late':''}">${fmtShort(t.deadline)}</span>
      <button class="pill hoy${t.enHoy?' on':''}" onclick="avToggle('${id}')">HOY</button></div>`;
  }).join('');
}
function avToggle(id) { const t = T(id); if (!t) return; t.enHoy = !t.enHoy; save(); renderAviso(); }
function avisoBanner() {
  const n = plazosSinPlan().length;
  return n ? `<div class="missed"><div class="mh"><span>📌 ${n === 1 ? 'Un plazo por planificar' : n + ' plazos por planificar'}</span>
    <button class="linkbtn" onclick="openAviso()">Ver</button></div></div>` : '';
}
// Una vez al día, en la primera apertura
function checkAvisoDiario() {
  const hoy = hoyDia();
  if (lsGet(K.aviso) === hoy || !lsGet(K.onb)) return;
  lsSet(K.aviso, hoy);
  openAviso();
}

// Vista de próximos: HOY y, debajo, cada día con tareas programadas (Mañana siempre se muestra)
function proxHTML() {
  const hoy = hoyDia();
  const gi = t => ambitos.findIndex(a => a.id === t.ambito);
  const porGrupo = (a, b) => gi(a) - gi(b) || byOrden(a, b);
  const seccion = (titulo, pend, done, vacio) => `<section class="group"><div class="ghead static">
      <span class="name">${titulo}</span><span class="count">${pend.length || ''}</span></div>
      <div class="rows">${pend.concat(done).map(t => rowHTML(t, true)).join('') || `<p class="none">${vacio}</p>`}</div></section>`;
  const hoyPend = tasks.filter(t => t.enHoy && !t.completada).sort(porGrupo);
  const hoyDone = tasks.filter(t => t.enHoy && t.completada).sort((a, b) => new Date(a.completadaEn) - new Date(b.completadaEn));
  let html = avisoBanner() + seccion('HOY · ' + fmtDiaLargo(hoy), hoyPend, hoyDone, 'Nada marcado para HOY');
  const futuras = tasks.filter(t => !t.completada && t.dia && t.dia > hoy);
  const dias = [...new Set(futuras.map(t => t.dia).concat(addDias(hoy, 1)))].sort();
  dias.forEach(d => {
    const delDia = futuras.filter(t => t.dia === d).sort((a, b) =>
      (a.alarma.activa ? new Date(a.alarma.fechaHora).getTime() : Infinity) - (b.alarma.activa ? new Date(b.alarma.fechaHora).getTime() : Infinity) || porGrupo(a, b));
    html += seccion((diasHasta(d) === 1 ? 'Mañana · ' : '') + fmtDiaLargo(d), delDia, [], 'Nada programado');
  });
  return html;
}

function missedList() {
  return tasks.filter(t => t.alarma.activa && t.alarma.perdida && !t.completada)
    .sort((a,b) => new Date(a.alarma.fechaHora) - new Date(b.alarma.fechaHora));
}
function missedHTML() {
  const m = missedList();
  if (!m.length) return '';
  return `<div class="missed"><div class="mh"><span>🔔 ${m.length === 1 ? 'Una alarma no sonó' : m.length + ' alarmas no sonaron'}</span>
    <button class="linkbtn" onclick="dismissMissed()">Entendido</button></div>
    ${m.map(t => `<div class="mi" onclick="openMissed('${t.id}')"><span>${esc(t.titulo)}</span><span>${fmtLong(t.alarma.fechaHora)}</span></div>`).join('')}</div>`;
}
function dismissMissed() { missedList().forEach(t => t.alarma.perdida = false); save(); render(); }
function openMissed(id) {
  const t = T(id); if (!t) return;
  t.alarma.perdida = false; scope = 'todas'; openId = id; plegados.delete(t.ambito);
  save(); render();
  const r = document.querySelector(`.row[data-id="${id}"]`); if (r) r.scrollIntoView({ block:'center', behavior:'smooth' });
}

function metaHTML(t) {
  const parts = [];
  if (!t.completada) {
    if (scope === 'todas' && t.enHoy) parts.push('<span class="hoytag">HOY</span>');
    if (t.prioridad) parts.push(`<i class="u" style="background:var(--${t.prioridad})"></i>`);
    if (t.deadline) {
      const late = new Date(t.deadline) < new Date();
      parts.push(`<span class="${late?'late':''}">${fmtShort(t.deadline)}</span>`);
    }
    if (t.dia && t.dia > hoyDia()) parts.push(`📅 ${fmtDia(t.dia)}${t.alarma.activa ? ' ' + hm(new Date(t.alarma.fechaHora)) : ''}`);
    else if (t.alarma.activa) parts.push(t.deadline ? '🔔' : `🔔 ${fmtShort(t.alarma.fechaHora)}`);
  }
  return parts.length ? `<span class="meta">${parts.join('')}</span>` : '';
}

// En la vista de próximos (prox) la fila no se arrastra y muestra su grupo
function rowHTML(t, prox) {
  const cls = t.completada ? ' done' : '';
  if (openId === t.id && !t.completada) return openRowHTML(t);
  const a = prox ? getAmbito(t.ambito) : null;
  const drag = prox ? '' : `onpointerdown="dragStart(event,'${t.id}')" `;
  return `<div class="row${cls}" data-id="${t.id}">
    <div class="line" ${t.completada ? '' : `${drag}onclick="toggleOpen('${t.id}')"`}>
      <button class="check" onclick="toggleComplete('${t.id}',event)" onpointerdown="event.stopPropagation()" aria-label="Completar"></button>
      <span class="title">${esc(t.titulo)}</span>${a ? `<span class="gtag"><i style="background:${esc(a.color)}"></i>${esc(a.nombre)}</span>` : ''}${metaHTML(t)}
    </div>
  </div>`;
}

// Fecha por defecto del campo: la hora siguiente en punto
function nextHourLocal() { const d = new Date(); d.setMinutes(0,0,0); d.setHours(d.getHours() + 1); return isoToLocal(d.toISOString()); }

// Atajos de un toque. "Hoy 18:00" solo se ofrece si todavía no pasó.
function presets() {
  const at = (dias, h) => { const d = new Date(); d.setDate(d.getDate() + dias); d.setHours(h, 0, 0, 0); return d; };
  return [{ label:'Mañana 18:00', d:at(1, 18) }, { label:'En 3 días', d:at(3, 18) }, { label:'En 1 semana', d:at(7, 18) }]
    .filter(x => x.d > Date.now());
}

// Atajos de Programar: cada uno da un día y, si lleva hora, la hora de la notificación
function progPresets() {
  const hoy = hoyDia(), now = Date.now();
  const at = h => { const d = new Date(); d.setHours(h, 0, 0, 0); return d; };
  const list = [
    { label:'En 10 min', when:new Date(now + 10 * 60000) },
    { label:'Hoy 18:00', when:at(18) },
    { label:'Mañana', dia:addDias(hoy, 1) },
  ];
  if (proxHabil(hoy) !== addDias(hoy, 1)) list.push({ label:'Lunes', dia:proxHabil(hoy) });
  list.push({ label:'En 1 semana', dia:addDias(hoy, 7) });
  return list.filter(x => !x.when || x.when.getTime() > now).map(x => ({ label:x.label, dia:x.dia || diaKey(x.when), when:x.when || null }));
}
const horaLocal = iso => isoToLocal(iso).slice(11);
// Campos de Otra…: día (obligatorio) y hora (opcional). Nada se guarda hasta tocar OK.
function progCustomHTML(pre, ok, cancel, dia, hora) {
  return `<span class="whenedit"><input type="date" class="dtin" id="${pre}Dia" value="${dia}" min="${hoyDia()}">
    <input type="time" class="dtin" id="${pre}Hora" value="${hora || ''}" aria-label="Hora, opcional">
    <small class="opt">hora opcional</small>
    <button class="okbtn" onclick="${ok}">OK</button>
    <button class="xbtn" onclick="${cancel}" aria-label="Cancelar">✕</button></span>`;
}
// Lee y valida los campos; marca en rojo lo que no sirve. Devuelve { dia, when } o null.
function readProg(pre) {
  const d = document.getElementById(pre + 'Dia'), h = document.getElementById(pre + 'Hora');
  if (!d || !d.value) return null;
  d.classList.toggle('bad', d.value < hoyDia());
  if (d.value < hoyDia()) return null;
  const when = h && h.value ? new Date(`${d.value}T${h.value}:00`) : null;
  if (h) h.classList.toggle('bad', !!when && when <= Date.now());
  if (when && when <= Date.now()) return null;
  return { dia:d.value, when };
}
const progInit = t => [t && t.dia && t.dia >= hoyDia() ? t.dia : addDias(hoyDia(), 1), t && t.alarma.activa ? horaLocal(t.alarma.fechaHora) : ''];
const progLabel = t => !t.dia ? null : (t.alarma.activa ? fmtLong(t.alarma.fechaHora) : fmtDiaLargo(t.dia));
function progField(id) {
  const t = T(id);
  if (editWhen && editWhen.id === id && editWhen.kind === 'prog') {
    if (editWhen.custom) { const [d, h] = progInit(t); return progCustomHTML('prog', `commitProg('${id}')`, 'cancelWhen()', d, h); }
    return `<span class="whenedit">${progPresets().map((x, i) => `<button class="pill" onclick="applyProgPreset('${id}',${i})">${x.label}</button>`).join('')}
      <button class="pill add" onclick="customWhen()">Otra…</button>
      <button class="xbtn" onclick="cancelWhen()" aria-label="Cancelar">✕</button></span>`;
  }
  const label = progLabel(t);
  return `<button class="pill ${label?'set':'add'}" onclick="startWhen('${id}','prog')">${label || '+ agregar'}</button>`
    + (label ? `<button class="xbtn" onclick="clearWhen('${id}','prog')" aria-label="Quitar">✕</button>` : '');
}

function whenField(kind, iso, id) {  // solo Plazo
  if (editWhen && editWhen.id === id && editWhen.kind === kind) {
    if (editWhen.custom) {
      return `<span class="whenedit"><input type="datetime-local" class="dtin" id="whenInput" value="${iso ? isoToLocal(iso) : nextHourLocal()}">
        <button class="okbtn" onclick="commitWhen('${id}','${kind}')">OK</button>
        <button class="xbtn" onclick="cancelWhen()" aria-label="Cancelar">✕</button></span>`;
    }
    return `<span class="whenedit">${presets(kind).map((x,i) => `<button class="pill" onclick="applyPreset('${id}','${kind}',${i})">${x.label}</button>`).join('')}
      <button class="pill add" onclick="customWhen()">Otra…</button>
      <button class="xbtn" onclick="cancelWhen()" aria-label="Cancelar">✕</button></span>`;
  }
  const label = iso ? fmtLong(iso) : '+ agregar';
  return `<button class="pill ${iso?'set':'add'}" onclick="startWhen('${id}','${kind}')">${label}</button>`
    + (iso ? `<button class="xbtn" onclick="clearWhen('${id}','${kind}')" aria-label="Quitar">✕</button>` : '');
}

function openRowHTML(t) {
  const urg = ['alta','media','baja'].map(p =>
    `<button class="${t.prioridad===p?'sel':''}" style="background:var(--${p})" onclick="setPrio('${t.id}','${p}')" aria-label="Urgencia ${p}"></button>`).join('');
  const groups = ambitos.map(a => `<option value="${a.id}"${a.id===t.ambito?' selected':''}>${esc(a.nombre)}</option>`).join('');
  return `<div class="row" data-id="${t.id}"><div class="open">
    <div class="line">
      <button class="check" onclick="toggleComplete('${t.id}',event)" aria-label="Completar"></button>
      <input class="title-in" value="${esc(t.titulo)}" onchange="setTitle('${t.id}',this.value)" onkeydown="if(event.key==='Enter')this.blur()">
      <button class="fold" onclick="toggleOpen('${t.id}')" >Cerrar</button>
    </div>
    <div class="detail">
      <div class="drow"><span class="k">Programar</span>${progField(t.id)}</div>
      <div class="drow"><span class="k">Plazo</span>${whenField('plazo', t.deadline, t.id)}</div>
      <div class="drow"><span class="k">Urgencia</span><span class="urg">${urg}</span></div>
      <div class="drow"><span class="k">Grupo</span><select class="gsel" onchange="setGroupOf('${t.id}',this.value)">${groups}</select></div>
      <div class="dfoot">
        <button class="pill hoy${t.enHoy?' on':''}" onclick="toggleHoy('${t.id}')">HOY</button>
        <button class="del" onclick="askDelete('${t.id}')">${confirmDelId===t.id ? '¿Eliminar? Toca otra vez' : 'Eliminar'}</button>
      </div>
    </div>
  </div></div>`;
}

// ─── ACCIONES ────────────────────────────────────────────────────
const T = id => tasks.find(x => x.id === id);

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}
// El campo de fecha no guarda hasta tocar OK: si hay otra hora elegida, avisa y devuelve true para que quien llama no salga.
function pendingWhen() {
  if (!editWhen || !editWhen.custom) return false;
  const t = T(editWhen.id);
  if (t && editWhen.kind === 'prog') {
    const d = document.getElementById('progDia'), h = document.getElementById('progHora');
    if (!d || (d.value + '|' + (h ? h.value : '')) === editWhen.orig) return false;
    toast('Toca OK para guardar, o ✕ para descartar');
    return true;
  }
  const inp = document.getElementById('whenInput');
  if (!inp || !inp.value || !t) return false;
  const saved = t.deadline;
  if (inp.value === (saved ? isoToLocal(saved) : editWhen.orig)) return false;
  toast('Toca OK para guardar la hora, o ✕ para descartarla');
  return true;
}
function setScope(s) { if (pendingWhen()) return; scope = s; openId = null; editWhen = null; render(); }
function toggleGroup(id) { plegados.has(id) ? plegados.delete(id) : plegados.add(id); savePlegados(); render(); }
function toggleOpen(id) {
  if (justDragged) return;
  if (pendingWhen()) return;
  openId = openId === id ? null : id; confirmDelId = null; editWhen = null; render();
}
function toggleComplete(id, e) {
  if (e) e.stopPropagation();
  const t = T(id); if (!t) return;
  t.completada = !t.completada;
  t.completadaEn = t.completada ? new Date().toISOString() : null;
  if (t.completada && openId === id) openId = null;
  if (t.completada) { cancelAlarm(id); t.alarma.srv = false; } else syncAlarmas();
  save(); render();
}
function toggleHoy(id) { const t = T(id); if (!t) return; t.enHoy = !t.enHoy; save(); render(); }
function setTitle(id, v) { const t = T(id); v = v.trim(); if (!t || !v) { render(); return; } t.titulo = v; if (t.alarma.activa) { t.alarma.srv = false; delete ultimoIntento[id]; } save(); syncAlarmas(); }
function setPrio(id, p) {
  const t = T(id); if (!t) return;
  t.prioridad = t.prioridad === p ? null : p;
  if (!t.manual) placeByRule(t);
  save(); render();
}
function setGroupOf(id, gid) {
  const t = T(id); if (!t) return;
  t.ambito = gid; t.manual = false; placeByRule(t); save(); render();
}
function startWhen(id, kind) { if (pendingWhen()) return; editWhen = { id, kind, custom:false }; render(); }
function customWhen() { editWhen.custom = true; editWhen.orig = editWhen.kind === 'prog' ? progInit(T(editWhen.id)).join('|') : nextHourLocal(); render(); }
function applyProgPreset(id, i) {
  const t = T(id), p = progPresets()[i]; if (!t || !p) return;
  editWhen = null;
  setProgramada(t, p.dia, p.when);
  save(); render();
  if (p.when) enablePush().then(syncAlarmas);
}
function commitProg(id) {
  const t = T(id), v = readProg('prog'); if (!t || !v) return;
  editWhen = null;
  setProgramada(t, v.dia, v.when);
  save(); render();
  if (v.when) enablePush().then(syncAlarmas);
}
function applyPreset(id, kind, i) {
  const x = presets(kind)[i]; if (!x) return;
  editWhen = null;
  setWhen(id, kind, x.d.toISOString(), true);
}
function cancelWhen() { editWhen = null; render(); }
function commitWhen(id, kind) {
  const inp = document.getElementById('whenInput');
  const val = inp && inp.value;
  if (!val) { cancelWhen(); return; }
  editWhen = null;
  setWhen(id, kind, val);
}
function setWhen(id, kind, val, isIso) {
  const t = T(id); if (!t || !val) return;
  const iso = isIso ? val : new Date(val).toISOString();
  t.deadline = iso;
  save(); render();
}
function clearWhen(id, kind) {
  const t = T(id); if (!t) return;
  if (kind === 'plazo') t.deadline = null;
  else clearProgramada(t);
  save(); render();
}
function askDelete(id) {
  if (confirmDelId !== id) { confirmDelId = id; render(); return; }
  cancelAlarm(id);
  tasks = tasks.filter(t => t.id !== id); openId = null; confirmDelId = null; save(); render();
}

// ─── ARRASTRAR (mantener presionado para reordenar dentro del grupo) ───
let drag = null, pressTimer = null, justDragged = false;
document.addEventListener('touchmove', e => { if (drag) e.preventDefault(); }, { passive:false });

function dragStart(e, id) {
  if (e.button > 0) return;
  const rowEl = e.currentTarget.closest('.row');
  const startX = e.clientX, startY = e.clientY;
  clearTimeout(pressTimer);
  const cancel = () => { clearTimeout(pressTimer); document.removeEventListener('pointermove', early); document.removeEventListener('pointerup', cancel); document.removeEventListener('pointercancel', cancel); };
  const early = ev => { if (Math.abs(ev.clientX-startX) > 8 || Math.abs(ev.clientY-startY) > 8) cancel(); };
  document.addEventListener('pointermove', early);
  document.addEventListener('pointerup', cancel);
  document.addEventListener('pointercancel', cancel);
  pressTimer = setTimeout(() => {
    cancel();
    const t = T(id); if (!t) return;
    drag = { id, gid:t.ambito, rowEl, target:null };
    rowEl.classList.add('dragging');
    if (navigator.vibrate) navigator.vibrate(15);
    document.addEventListener('pointermove', dragMove);
    document.addEventListener('pointerup', dragEnd);
    document.addEventListener('pointercancel', dragAbort);
  }, 350);
}
function dragMove(e) {
  if (!drag) return;
  document.querySelectorAll('.drop-before').forEach(x => x.classList.remove('drop-before'));
  document.querySelectorAll('.drop-end').forEach(x => x.classList.remove('drop-end'));
  const sec = document.querySelector(`.group[data-gid="${drag.gid}"]`);
  const rows = [...sec.querySelectorAll('.row:not(.done)')].filter(r => r !== drag.rowEl);
  const before = rows.find(r => e.clientY < r.getBoundingClientRect().top + r.getBoundingClientRect().height / 2);
  drag.target = before ? before.dataset.id : null;
  if (before) before.classList.add('drop-before'); else sec.classList.add('drop-end');
}
function dragFinish() {
  document.removeEventListener('pointermove', dragMove);
  document.removeEventListener('pointerup', dragEnd);
  document.removeEventListener('pointercancel', dragAbort);
  justDragged = true; setTimeout(() => justDragged = false, 350);
}
function dragEnd() {
  if (!drag) return;
  const { id, gid, target } = drag; drag = null; dragFinish();
  const t = T(id);
  const list = tasks.filter(x => x.ambito === gid && !x.completada).sort(byOrden);
  const from = list.findIndex(x => x.id === id);
  if (from > -1) list.splice(from, 1);
  const to = target ? list.findIndex(x => x.id === target) : -1;
  list.splice(to === -1 ? list.length : to, 0, t);
  list.forEach((x,i) => x.orden = i * 10);
  t.manual = true;
  save(); render();
}
function dragAbort() { if (!drag) return; drag = null; dragFinish(); render(); }

// ─── AGREGAR ─────────────────────────────────────────────────────
function openAdd() {
  const last = lsGet(K.ultimo);
  addGroup = getAmbito(last) ? last : (ambitos[0] ? ambitos[0].id : null);
  document.getElementById('addInput').value = '';
  document.getElementById('addFlash').textContent = '';
  document.getElementById('newGroupName').value = '';
  dupConfirmado = false; ocultarDup();
  addDraft = { prog:null, deadline:null, prioridad:null, enHoy:true }; addEdit = null;
  renderAddDetails();
  renderChips(!ambitos.length);
  document.getElementById('addOverlay').classList.add('open');
  setTimeout(() => document.getElementById('addInput').focus(), 150);
}
function closeAdd() { document.getElementById('addOverlay').classList.remove('open'); document.getElementById('addInput').blur(); }
function renderChips(showNew) {
  document.getElementById('addChips').innerHTML =
    ambitos.map(a => `<button class="pill${a.id===addGroup?' sel':''}" onclick="pickGroup('${a.id}')">${esc(a.nombre)}</button>`).join('')
    + `<button class="pill add" onclick="toggleNewGroup()">+ grupo</button>`;
  document.getElementById('newGroupRow').style.display = showNew ? 'flex' : 'none';
  if (showNew) document.getElementById('newGroupName').placeholder = ambitos.length ? 'Nombre del grupo' : 'Primer grupo (ej. Casa)';
}
// Programar en la hoja de agregar: addDraft.prog = { dia, when } o null
function addProgField() {
  const p = addDraft.prog;
  if (addEdit && addEdit.kind === 'prog') {
    if (addEdit.custom) { const [d, h] = progInit(null); return progCustomHTML('addProg', 'addCommitProg()', 'addCancelWhen()', d, h); }
    return `<span class="whenedit">${progPresets().map((x, i) => `<button class="pill" onclick="addProgPreset(${i})">${x.label}</button>`).join('')}
      <button class="pill add" onclick="addEdit.custom=true;renderAddDetails()">Otra…</button>
      <button class="xbtn" onclick="addCancelWhen()" aria-label="Cancelar">✕</button></span>`;
  }
  const label = p ? (p.when ? fmtLong(p.when.toISOString()) : fmtDiaLargo(p.dia)) : null;
  return `<button class="pill ${label?'set':'add'}" onclick="addEdit={kind:'prog',custom:false};renderAddDetails()">${label || '+ agregar'}</button>`
    + (label ? `<button class="xbtn" onclick="addSetProg(null)" aria-label="Quitar">✕</button>` : '');
}
function addSetProg(p) { addDraft.prog = p; addDraft.enHoy = p ? p.dia <= hoyDia() : true; addEdit = null; renderAddDetails(); }
function addProgPreset(i) { const x = progPresets()[i]; if (x) addSetProg({ dia:x.dia, when:x.when }); }
function addCommitProg() { const v = readProg('addProg'); if (v) addSetProg(v); }
function addWhenField(kind, iso) {
  if (addEdit && addEdit.kind === kind) {
    if (addEdit.custom) {
      return `<span class="whenedit"><input type="datetime-local" class="dtin" id="addWhenInput" value="${iso ? isoToLocal(iso) : nextHourLocal()}">
        <button class="okbtn" onclick="addCommitWhen('${kind}')">OK</button>
        <button class="xbtn" onclick="addCancelWhen()" aria-label="Cancelar">✕</button></span>`;
    }
    return `<span class="whenedit">${presets(kind).map((x,i) => `<button class="pill" onclick="addPreset('${kind}',${i})">${x.label}</button>`).join('')}
      <button class="pill add" onclick="addEdit.custom=true;renderAddDetails()">Otra…</button>
      <button class="xbtn" onclick="addCancelWhen()" aria-label="Cancelar">✕</button></span>`;
  }
  return `<button class="pill ${iso?'set':'add'}" onclick="addEdit={kind:'${kind}',custom:false};renderAddDetails()">${iso ? fmtLong(iso) : '+ agregar'}</button>`
    + (iso ? `<button class="xbtn" onclick="addSetWhen('${kind}',null)" aria-label="Quitar">✕</button>` : '');
}
function renderAddDetails() {
  const d = addDraft; if (!d) return;
  const urg = ['alta','media','baja'].map(p =>
    `<button class="${d.prioridad===p?'sel':''}" style="background:var(--${p})" onclick="addDraft.prioridad=addDraft.prioridad==='${p}'?null:'${p}';renderAddDetails()" aria-label="Urgencia ${p}"></button>`).join('');
  document.getElementById('addDetails').innerHTML = `
    <div class="drow"><span class="k">Programar</span>${addProgField()}</div>
    <div class="drow"><span class="k">Plazo</span>${addWhenField('plazo', d.deadline)}</div>
    <div class="drow"><span class="k">Urgencia</span><span class="urg">${urg}</span></div>
    <div class="drow"><span class="k">Hoy</span><button class="pill hoy${d.enHoy?' on':''}" onclick="addDraft.enHoy=!addDraft.enHoy;renderAddDetails()">HOY</button></div>`;
}
function addSetWhen(kind, iso) { addDraft.deadline = iso; addEdit = null; renderAddDetails(); }
function addPreset(kind, i) { const x = presets(kind)[i]; if (x) addSetWhen(kind, x.d.toISOString()); }
function addCancelWhen() { addEdit = null; renderAddDetails(); }
function addCommitWhen(kind) {
  const inp = document.getElementById('addWhenInput'); const val = inp && inp.value;
  if (!val) { addCancelWhen(); return; }
  addSetWhen(kind, new Date(val).toISOString());
}
function pickGroup(id) { addGroup = id; renderChips(false); document.getElementById('addInput').focus(); }
function toggleNewGroup() {
  const row = document.getElementById('newGroupRow');
  renderChips(row.style.display === 'none');
  if (row.style.display !== 'none') document.getElementById('newGroupName').focus();
}
function createGroup(nombre, color) {
  const id = nombre.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'').slice(0,28) + '_' + Date.now().toString(36).slice(-4);
  ambitos.push({ id, nombre, color: color || nextColor() });
  save();
  return id;
}
function createGroupFromSheet() {
  const inp = document.getElementById('newGroupName'); const n = inp.value.trim();
  if (!n) { inp.focus(); return; }
  addGroup = createGroup(n); inp.value = '';
  renderChips(false); render();
  document.getElementById('addInput').focus();
}
// Aviso de posible duplicado en la hoja de agregar: no bloquea
let dupConfirmado = false;
function ocultarDup() { document.getElementById('addDup').style.display = 'none'; }
function mostrarDup(dup, nueva) {
  const box = document.getElementById('addDup');
  box.innerHTML = `<div class="dupmsg">Se parece a ${dup.map(x => `«${esc(x.t.titulo)}»${x.t.dia ? ' (' + fmtDia(x.t.dia) + ')' : ''}`).join(', ')}.</div>
    <div class="btnrow"><button class="btn2" onclick="dupResolver(false)">No es duplicada</button><button class="btn2" onclick="dupResolver(true)">Es duplicada</button></div>`;
  box.style.display = 'block';
  box._dup = { dup, titulo: nueva.titulo };
}
function dupResolver(esDuplicada) {
  const box = document.getElementById('addDup'), info = box._dup;
  if (!info) return;
  if (esDuplicada) {
    ocultarDup();
    document.getElementById('addInput').value = '';
    const f = document.getElementById('addFlash'); f.textContent = 'No se agregó: ya existe';
    setTimeout(() => { if (f.textContent.startsWith('No se agregó')) f.textContent = ''; }, 2200);
    return;
  }
  const no = dupDescartados();
  info.dup.forEach(x => no.add(parKey(x.t.titulo, info.titulo)));
  lsSet(K.dupNo, JSON.stringify([...no].slice(-300)));
  dupConfirmado = true;
  submitAdd();
}
function submitAdd() {
  const inp = document.getElementById('addInput'); const titulo = inp.value.trim();
  if (!titulo) { inp.focus(); return; }
  if (!addGroup) {
    const g = document.getElementById('newGroupName');
    if (g.value.trim()) createGroupFromSheet(); else { renderChips(true); g.focus(); return; }
  }
  const pg = addDraft.prog;
  const nueva = { titulo, ambito:addGroup, dia: pg ? pg.dia : null };
  if (!dupConfirmado) {
    const dup = posiblesDuplicadas(nueva);
    if (dup.length) { mostrarDup(dup, nueva); return; }
  }
  dupConfirmado = false; ocultarDup();
  const t = {
    id:uid(), titulo, ambito:addGroup, prioridad:addDraft.prioridad, deadline:addDraft.deadline,
    enHoy:addDraft.enHoy, completada:false, completadaEn:null,
    dia: pg ? pg.dia : null, diaAplicada: !(pg && pg.dia > hoyDia()),
    alarma: pg && pg.when ? { activa:true, fechaHora:pg.when.toISOString(), disparada:false } : { activa:false, fechaHora:null, disparada:false }, manual:false,
    fechaCreacion:new Date().toISOString(), orden:0,
  };
  tasks.push(t); placeByRule(t);
  plegados.delete(addGroup); savePlegados();
  lsSet(K.ultimo, addGroup);
  save(); render();
  if (t.alarma.activa) enablePush().then(syncAlarmas);
  addDraft = { prog:null, deadline:null, prioridad:null, enHoy:true }; addEdit = null; renderAddDetails();
  inp.value = ''; inp.focus();
  const f = document.getElementById('addFlash'); f.textContent = '✓ Agregada en ' + getAmbito(addGroup).nombre;
  setTimeout(() => { if (f.textContent.startsWith('✓')) f.textContent = ''; }, 1800);
}
