// ─── AJUSTES ─────────────────────────────────────────────────────
function openSettings() { renderSettings(); document.getElementById('setOverlay').classList.add('open'); }
function closeSettings() { document.getElementById('setOverlay').classList.remove('open'); render(); }
function renderSettings() {
  document.getElementById('setName').value = userName;
  document.getElementById('setTema').innerHTML = [['sistema','Automático'],['claro','Claro'],['oscuro','Oscuro']]
    .map(([v,l]) => `<button class="${prefs.tema===v?'on':''}" onclick="setTema('${v}')">${l}</button>`).join('');
  document.getElementById('setAcento').innerHTML = ACENTOS
    .map(c => `<button class="swatch${prefs.acento===c?' on':''}" style="background:${c}" onclick="setAcento('${c}')" aria-label="Color ${c}"></button>`).join('');
  document.getElementById('setGroups').innerHTML = ambitos.length ? ambitos.map(a => {
    const c = tasks.filter(t => t.ambito === a.id).length;
    return `<div class="grow"><i class="dot" style="background:${esc(a.color)}"></i><span class="n">${esc(a.nombre)}</span>
      <span class="c">${c} tarea${c!==1?'s':''}</span>
      <button class="del" ${c?'disabled title="Tiene tareas"':''} onclick="deleteGroup('${a.id}')">Eliminar</button></div>`;
  }).join('') : '<p class="hint">Aún no hay grupos.</p>';
  document.getElementById('setNewColor').value = nextColor();
  renderPushInfo();
  renderWidgetInfo();
}
function saveName(v) { userName = v.trim(); lsSet(K.name, userName); render(); }
function setTema(v) { prefs.tema = v; lsSet(K.tema, v); applyTheme(); renderSettings(); }
function setAcento(c) { prefs.acento = c; lsSet(K.acento, c); applyTheme(); renderSettings(); }
function addGroupFromSettings() {
  const inp = document.getElementById('setNewName'); const n = inp.value.trim();
  if (!n) { inp.focus(); return; }
  createGroup(n, document.getElementById('setNewColor').value); inp.value = '';
  renderSettings();
}
function deleteGroup(id) {
  if (tasks.some(t => t.ambito === id)) return;
  ambitos = ambitos.filter(a => a.id !== id); plegados.delete(id); save(); renderSettings();
}
function exportJSON() {
  const b = new Blob([JSON.stringify({ tasks, ambitos }, null, 2)], { type:'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(b);
  a.download = 'tareas_' + new Date().toISOString().slice(0,10) + '.json'; a.click();
}
function importJSON(input) {
  const file = input.files[0]; input.value = ''; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.tasks) || !Array.isArray(d.ambitos)) throw 0;
      if (!confirm(`Esto reemplaza tus datos actuales por ${d.tasks.length} tareas y ${d.ambitos.length} grupos. ¿Continuar?`)) return;
      tasks = d.tasks; ambitos = d.ambitos; normalize(); save(); renderSettings(); render();
    } catch(e) { alert('El archivo no es un respaldo válido de Tareas.'); }
  };
  r.readAsText(file);
}

// ─── TEMA ────────────────────────────────────────────────────────
function applyTheme() {
  const root = document.documentElement;
  if (prefs.tema === 'claro') root.setAttribute('data-theme','light');
  else if (prefs.tema === 'oscuro') root.setAttribute('data-theme','dark');
  else root.removeAttribute('data-theme');
  root.style.setProperty('--accent', prefs.acento);
  document.getElementById('metaTheme').content = getComputedStyle(root).getPropertyValue('--bg').trim();
}
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

// ─── ALARMAS ─────────────────────────────────────────────────────
// Una alarma que se detecta tarde (app cerrada o dormida) ya no sirve como
// notificación: queda en el aviso de arriba para que no se pierda en silencio.
const ALARMA_TOLERANCIA = 2 * 60 * 1000;
function checkAlarmas() {
  const now = Date.now();
  let changed = false;
  tasks.forEach(t => {
    const al = t.alarma;
    if (!al.activa || al.disparada || t.completada) return;
    const due = new Date(al.fechaHora).getTime();
    if (due > now) return;
    // Encolada en el servidor: el push es quien avisa (con la app abierta o cerrada).
    // Avisar también desde aquí repetiría la notificación al abrir la app.
    if (al.srv) { al.disparada = true; changed = true; return; }
    const puedeAvisar = 'Notification' in window && Notification.permission === 'granted';
    if (now - due > ALARMA_TOLERANCIA || !puedeAvisar) al.perdida = true;
    else dispararAlarma(t);
    al.disparada = true; changed = true;
  });
  if (changed) { save(); render(); }
}
async function dispararAlarma(task) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const a = getAmbito(task.ambito);
  const options = {
    body: a ? `Grupo: ${a.nombre}` : '', tag: 'tarea-' + task.id, data: { taskId: task.id, titulo: task.titulo },
    actions: [{ action: 'snooze10', title: 'Posponer 10 min' }], vibrate: [200, 100, 200, 100, 200], requireInteraction: true
  };
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    if (reg) { reg.showNotification('⏰ ' + task.titulo, options); return; }
  } catch(e) {}
  new Notification('⏰ ' + task.titulo, { body: options.body, tag: options.tag });
}
// ─── ALARMAS CON LA APP CERRADA (Web Push + QStash, ver PLAN.md) ──
// Cada dispositivo tiene su propio código: las tareas viven en el dispositivo,
// así que sus alarmas también.
const API = { key:'/api/push/key', sub:'/api/push/subscribe', alarms:'/api/alarms/schedule' };
function syncCode() {
  let c = lsGet(K.codigo);
  if (!/^[a-f0-9]{32}$/.test(c || '')) {
    const a = new Uint8Array(16); crypto.getRandomValues(a);
    c = Array.from(a, b => b.toString(16).padStart(2,'0')).join('');
    lsSet(K.codigo, c);
  }
  return c;
}
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const iosNeedsInstall = () => /iphone|ipad|ipod/i.test(navigator.userAgent) && !(navigator.standalone || matchMedia('(display-mode: standalone)').matches);
function pushState() {
  if (iosNeedsInstall()) return 'instalar';
  if (!pushSupported()) return 'nosoporte';
  if (Notification.permission === 'denied') return 'denegado';
  return Notification.permission === 'granted' && lsGet(K.push) === '1' ? 'activo' : 'inactivo';
}
function urlB64ToUint8(b64) {
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from(raw, ch => ch.charCodeAt(0));
}
async function enablePush() {
  if (!pushSupported() || iosNeedsInstall()) return false;
  if (Notification.permission === 'default') await Notification.requestPermission();
  if (Notification.permission !== 'granted') return false;
  try {
    const reg = await navigator.serviceWorker.ready;
    const { key } = await (await fetch(API.key)).json();
    const sub = (await reg.pushManager.getSubscription()) ||
      await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:urlB64ToUint8(key) });
    const r = await fetch(API.sub, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ code:syncCode(), subscription:sub.toJSON() }) });
    if (!r.ok) throw new Error('subscribe ' + r.status);
    // El service worker no ve localStorage: se lo dejamos en Cache Storage
    await (await caches.open('tareas-meta')).put('/__code', new Response(syncCode()));
    lsSet(K.push, '1');
    return true;
  } catch(e) { return false; }
}
let syncing = false;
const ultimoIntento = {};
const VENTANA_SERVIDOR = 23 * 3600e3; // QStash gratuito acepta hasta 24 h; las más lejanas las encola el cron diario
async function syncAlarmas() {
  if (syncing || lsGet(K.push) !== '1') return;
  syncing = true;
  try {
    for (const t of tasks) {
      const al = t.alarma;
      if (!al.activa || al.disparada || al.srv || t.completada) continue;
      const falta = new Date(al.fechaHora) - Date.now();
      // Muy lejos: el cron diario del servidor la encola. Aquí solo se reintenta al entrar en la ventana.
      if (falta <= 0 || falta > VENTANA_SERVIDOR || Date.now() - (ultimoIntento[t.id] || 0) < 10 * 60 * 1000) continue;
      ultimoIntento[t.id] = Date.now();
      const r = await fetch(API.alarms, { method:'POST', headers:{ 'Content-Type':'application/json' },
        body:JSON.stringify({ code:syncCode(), taskId:t.id, titulo:t.titulo, at:al.fechaHora }) });
      if (r.ok) { al.srv = !!(await r.json()).queued; save(); }
    }
  } catch(e) { /* sin red: se reintenta en el próximo ciclo */ }
  syncing = false;
}
function cancelAlarm(id) {
  if (lsGet(K.push) !== '1') return;
  fetch(`${API.alarms}?code=${syncCode()}&taskId=${encodeURIComponent(id)}`, { method:'DELETE' }).catch(() => {});
}
function renderPushInfo() {
  const st = pushState();
  const msg = {
    activo:'Activas: las alarmas suenan aunque la app esté cerrada en este dispositivo.',
    inactivo:'Actívalas para que las alarmas suenen aunque la app esté cerrada.',
    denegado:'Las notificaciones están bloqueadas. Permítelas desde los ajustes del navegador o del teléfono.',
    instalar:'En iPhone, primero agrega la app a la pantalla de inicio (Compartir → Agregar a inicio) y ábrela desde ahí.',
    nosoporte:'Este navegador no permite alarmas con la app cerrada. Seguirán sonando mientras esté abierta.'
  }[st];
  document.getElementById('pushInfo').textContent = msg;
  document.getElementById('pushBtn').style.display = st === 'inactivo' ? '' : 'none';
}
async function onPushBtn() {
  const ok = await enablePush();
  renderPushInfo();
  if (ok) syncAlarmas();
}

// ─── WIDGET DEL MAC (solo lectura) ───────────────────────────────
// Si está activo, cada cambio sube una instantánea de HOY (título, grupo,
// urgencia, plazo) que el widget del Mac lee con un código de solo lectura
// derivado del código del dispositivo. Ver PLAN.md, Fase D.
const SNAP_API = '/api/snapshot';
const widgetOn = () => lsGet(K.widget) === '1';
let snapTimer = null, snapSending = false, snapLast = '';
async function readToken() {
  const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('tareas-lectura:' + syncCode()));
  return Array.from(new Uint8Array(d), b => b.toString(16).padStart(2, '0')).join('');
}
function snapshotBody() {
  const f = new Date(), p = n => String(n).padStart(2, '0');
  const items = [];
  ambitos.forEach(a => tasks.filter(t => t.ambito === a.id && t.enHoy && !t.completada).sort(byOrden)
    .forEach(t => items.push({ titulo:t.titulo, grupo:a.nombre, color:a.color, urgencia:t.prioridad || null, plazo:t.deadline || null,
      alarma:t.alarma.activa ? t.alarma.fechaHora : null })));
  return JSON.stringify({ code:syncCode(), fecha:`${f.getFullYear()}-${p(f.getMonth()+1)}-${p(f.getDate())}`, nombre:userName, acento:prefs.acento, items });
}
// Con retraso para agrupar cambios seguidos; si no llega al servidor queda pendiente y se reintenta
function queueSnapshot() {
  if (!widgetOn()) return;
  if (snapBodyUnchanged()) return;
  lsSet(K.snapPend, '1');
  clearTimeout(snapTimer); snapTimer = setTimeout(sendSnapshot, 1500);
}
const snapBodyUnchanged = () => snapshotBody() === snapLast && lsGet(K.snapPend) !== '1';
async function sendSnapshot() {
  snapTimer = null;
  if (!widgetOn() || snapSending) return;
  snapSending = true;
  const body = snapshotBody();
  try {
    const r = await fetch(SNAP_API, { method:'POST', headers:{ 'Content-Type':'application/json' }, body });
    if (r.ok) { snapLast = body; lsSet(K.snapPend, '0'); }
  } catch(e) { /* sin red: queda pendiente */ }
  snapSending = false;
}
function retrySnapshot() { if (widgetOn() && lsGet(K.snapPend) === '1' && !snapTimer) sendSnapshot(); }
window.addEventListener('online', retrySnapshot);
async function toggleWidget() {
  if (widgetOn()) {
    lsSet(K.widget, '0'); lsSet(K.snapPend, '0'); snapLast = '';
    fetch(`${SNAP_API}?code=${syncCode()}`, { method:'DELETE' }).catch(() => {});
  } else {
    lsSet(K.widget, '1'); lsSet(K.snapPend, '1'); sendSnapshot();
  }
  renderWidgetInfo();
}
async function renderWidgetInfo() {
  const on = widgetOn();
  document.getElementById('widgetInfo').textContent = on
    ? 'Activo: este dispositivo publica la lista de HOY (título, grupo, urgencia, plazo y alarma) y tu nombre para el widget del Mac. Copia los datos del widget y pégalos en el archivo de configuración del Mac. Solo permite leer.'
    : 'Publica la lista de HOY en el servidor para verla en el widget del Mac. Es de solo lectura; marcar tareas se hace aquí.';
  document.getElementById('widgetBtn').textContent = on ? 'Desactivar' : 'Activar';
  document.getElementById('widgetCopy').style.display = on ? '' : 'none';
}
async function copyWidgetToken() {
  const b = document.getElementById('widgetCopy');
  try { await navigator.clipboard.writeText(location.origin + '\n' + await readToken() + '\n'); b.textContent = 'Copiado'; }
  catch(e) { b.textContent = 'No se pudo copiar'; }
  setTimeout(() => { b.textContent = 'Copiar datos del widget'; }, 2000);
}

// ─── HOJA DE ALARMA: posponer / hecho ────────────────────────────
let alId = null;
function openAlarmSheet(id) {
  const t = T(id); if (!t || t.completada) return;
  alId = id;
  document.getElementById('alTitle').textContent = t.titulo;
  document.getElementById('alWhen').textContent = t.alarma.activa ? 'Alarma de ' + fmtLong(t.alarma.fechaHora) : '';
  document.getElementById('alOverlay').classList.add('open');
}
function closeAlarmSheet() {
  document.getElementById('alOverlay').classList.remove('open');
  document.getElementById('alPick').style.display = 'none';
  alId = null;
}
function showSnoozePick() {
  document.getElementById('alInput').value = nextHourLocal();
  document.getElementById('alInput').classList.remove('bad');
  document.getElementById('alPick').style.display = 'flex';
}
function snoozeFromPick() {
  const inp = document.getElementById('alInput');
  if (!inp.value || new Date(inp.value) <= Date.now()) { inp.classList.add('bad'); return; }
  snoozeAt(inp.value);
}
function snoozeTomorrow() { const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(9, 0, 0, 0); snoozeAt(d.toISOString(), true); }
function snoozeMinutes(min) { snoozeAt(new Date(Date.now() + min * 60000).toISOString(), true); }
function snoozeAt(val, isIso) {
  const t = T(alId); if (!t || !val) return;
  const iso = isIso ? val : new Date(val).toISOString();
  if (new Date(iso) <= Date.now()) return;
  t.alarma = { activa:true, fechaHora:iso, disparada:false, perdida:false, srv:false };
  seguirAlarma(t);
  delete ultimoIntento[t.id];
  save(); closeAlarmSheet(); render();
  enablePush().then(syncAlarmas);
}
function doneFromSheet() { const id = alId; closeAlarmSheet(); if (T(id) && !T(id).completada) toggleComplete(id); }

// Pospuestos desde el botón de la notificación con la app cerrada: el service
// worker ya reprogramó la alarma en el servidor; aquí se refleja en la tarea.
async function applyPendingSnoozes() {
  if (!('caches' in window)) return;
  try {
    const c = await caches.open('tareas-meta');
    const hit = await c.match('/__snooze'); if (!hit) return;
    const list = await hit.json(); await c.delete('/__snooze');
    let changed = false;
    list.forEach(sn => {
      const t = T(sn.taskId);
      if (t && !t.completada) { t.alarma = { activa:true, fechaHora:sn.at, disparada:false, perdida:false, srv:true }; seguirAlarma(t); changed = true; }
    });
    if (changed) { save(); render(); }
  } catch(e) {}
}
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data && e.data.type === 'alarma') { applyPendingSnoozes().then(() => openAlarmSheet(e.data.taskId)); }
  });
}

function tick() {
  retrySnapshot();
  applyPendingSnoozes();
  syncAlarmas();
  checkAlarmas();
  if (purgeCompleted() | aplicarProgramadas()) { save(); render(); }
}
setInterval(tick, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); checkAvisoDiario(); } });

// ─── TECLADO ─────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  closeAdd(); closeSettings(); closeAlarmSheet(); closeAviso();
});

// ─── INICIALIZACIÓN (primer uso) ─────────────────────────────────
const SUGERIDOS = ['Casa','Personal','Trabajo','Compras','Estudio','Familia'];
let onb = { steps:[], i:0, grupos:[] };

function startOnboarding(fresh) {
  onb = { steps: fresh ? ['nombre','colores','grupos'] : ['nombre','colores'], i:0, grupos:[] };
  document.getElementById('onb').classList.add('open');
  renderOnb();
}
function onbDots() {
  return `<div class="dots">${onb.steps.map((_,i) => `<i class="${i<=onb.i?'on':''}"></i>`).join('')}</div>`;
}
function renderOnb() {
  const step = onb.steps[onb.i];
  const last = onb.i === onb.steps.length - 1;
  let h = onbDots();
  if (step === 'nombre') {
    h += `<h1>Hola 👋</h1><p class="lead">Esta es tu lista de tareas, simple como un papel. ¿Cómo te llamas?</p>
      <div class="field"><input type="text" id="onbName" placeholder="Tu nombre" value="${esc(userName)}" autocomplete="given-name" onkeydown="if(event.key==='Enter')onbNext()"></div>
      <div class="spacer"></div><button class="primary" onclick="onbNext()">Continuar</button>`;
  } else if (step === 'colores') {
    h += `<h1>Elige tus colores</h1><p class="lead">Puedes cambiarlos cuando quieras en Ajustes.</p>
      <div class="sub" style="margin-top:0">Modo</div>
      <div class="seg" id="onbTema">${[['sistema','Automático'],['claro','Claro'],['oscuro','Oscuro']].map(([v,l]) => `<button class="${prefs.tema===v?'on':''}" onclick="onbTema('${v}')">${l}</button>`).join('')}</div>
      <div class="sub">Color de acento</div>
      <div class="swatches">${ACENTOS.map(c => `<button class="swatch${prefs.acento===c?' on':''}" style="background:${c}" onclick="onbAcento('${c}')" aria-label="Color ${c}"></button>`).join('')}</div>
      <div class="spacer"></div><button class="primary" onclick="onbNext()">${last ? 'Empezar' : 'Continuar'}</button>`;
  } else {
    h += `<h1>¿Quieres crear grupos?</h1><p class="lead">Los grupos son los ámbitos de tu lista, como secciones del papel. Elige algunos ahora o créalos cuando agregues tareas.</p>
      <div class="chips">${SUGERIDOS.map(n => `<button class="pill${onb.grupos.includes(n)?' sel':''}" onclick="onbToggleGrupo('${n}')">${n}</button>`).join('')}
        ${onb.grupos.filter(n => !SUGERIDOS.includes(n)).map(n => `<button class="pill sel" onclick="onbToggleGrupo('${esc(n)}')">${esc(n)}</button>`).join('')}</div>
      <div class="newg"><input type="text" id="onbNewGroup" placeholder="Otro grupo…" onkeydown="if(event.key==='Enter'){event.preventDefault();onbAddGrupo();}">
        <button class="send" onclick="onbAddGrupo()" aria-label="Agregar grupo">+</button></div>
      <div class="spacer"></div>
      <button class="primary" onclick="onbFinish()">${onb.grupos.length ? 'Crear grupos y empezar' : 'Empezar'}</button>
      <button class="ghost" onclick="onbFinish(true)">Prefiero definirlos al agregar tareas</button>`;
  }
  document.getElementById('onbBody').innerHTML = h;
  const f = document.getElementById('onbName'); if (f) setTimeout(() => f.focus(), 100);
}
function onbNext() {
  const step = onb.steps[onb.i];
  if (step === 'nombre') {
    const v = document.getElementById('onbName').value.trim();
    if (!v) { document.getElementById('onbName').focus(); return; }
    userName = v; lsSet(K.name, v);
  }
  if (onb.i === onb.steps.length - 1) { onbFinish(true); return; }
  onb.i++; renderOnb();
}
function onbTema(v) { prefs.tema = v; lsSet(K.tema, v); applyTheme(); renderOnb(); }
function onbAcento(c) { prefs.acento = c; lsSet(K.acento, c); applyTheme(); renderOnb(); }
function onbToggleGrupo(n) {
  onb.grupos = onb.grupos.includes(n) ? onb.grupos.filter(x => x !== n) : [...onb.grupos, n];
  renderOnb();
}
function onbAddGrupo() {
  const inp = document.getElementById('onbNewGroup'); const n = inp.value.trim();
  if (!n) { inp.focus(); return; }
  if (!onb.grupos.includes(n)) onb.grupos.push(n);
  renderOnb(); setTimeout(() => document.getElementById('onbNewGroup').focus(), 50);
}
function onbFinish(skipGroups) {
  if (!skipGroups) onb.grupos.forEach(n => { if (!ambitos.some(a => a.nombre.toLowerCase() === n.toLowerCase())) createGroup(n); });
  lsSet(K.onb, '1'); save();
  document.getElementById('onb').classList.remove('open');
  render();
}

// ─── INIT ────────────────────────────────────────────────────────
const esPrimeraVez = lsGet(K.tasks) === null && lsGet(K.ambitos) === null;
load();
aplicarProgramadas();
queueSnapshot();
applyTheme();
render();
checkAlarmas();
applyPendingSnoozes().then(() => {
  const id = new URLSearchParams(location.search).get('alarma');
  if (id) { history.replaceState(null, '', location.pathname); openAlarmSheet(id); }
});
if (lsGet(K.push) === '1') enablePush().then(syncAlarmas);
checkAvisoDiario();
if (!lsGet(K.onb)) {
  if (esPrimeraVez) startOnboarding(true);
  else if (!userName) startOnboarding(false);
  else lsSet(K.onb, '1');
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
